<!DOCTYPE html><html><head><meta charset="utf-8"><title>LOADING</title></head>
<body><h3>v12 GPU deep</h3>
<pre id="log" style="font-size:10px;background:#111;color:#0f0;padding:8px;max-height:700px;overflow:auto;white-space:pre-wrap;"></pre>
<canvas id="c" width="256" height="256" style="display:none;"></canvas>
<script>
function log(m){let e=document.getElementById('log');if(e)e.innerHTML+=m+'\n';document.title='['+m.substring(0,50)+']';}

function fuzz(){
  let c=document.getElementById('c');
  let gl=c.getContext('webgl2');
  if(!gl){log('[!] No WebGL2');return;}
  log('[*] v12 — GPU deep fuzz, Maleoon 910');

  // === debug_shaders: see compiled shader source ===
  log('\n=== Debug Shaders (driver internals) ===');
  try{
    let dbgShaders=gl.getExtension('WEBGL_debug_shaders');
    if(dbgShaders){
      let vs='#version 300 es\nin vec4 p;void main(){gl_Position=p;}';
      let sh=gl.createShader(gl.VERTEX_SHADER);
      gl.shaderSource(sh,vs);gl.compileShader(sh);
      let translated=dbgShaders.getTranslatedShaderSource(sh);
      log('[+] Translated shader:\n'+translated.substring(0,500));
      gl.deleteShader(sh);
    }else log('[!] debug_shaders not available');
  }catch(e){log('[!] debug: '+e.message.substring(0,80));}

  // === Timer query for precise GPU timing ===
  log('\n=== Disjoint Timer Query ===');
  try{
    let ext=gl.getExtension('EXT_disjoint_timer_query_webgl2');
    if(ext){
      let q=gl.createQuery();
      gl.beginQuery(ext.TIME_ELAPSED_EXT,q);
      // Draw something
      gl.clearColor(1,0,0,1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.endQuery(ext.TIME_ELAPSED_EXT);
      // Wait for result
      setTimeout(()=>{
        let available=gl.getQueryParameter(q,gl.QUERY_RESULT_AVAILABLE);
        if(available){
          let ns=gl.getQueryParameter(q,gl.QUERY_RESULT);
          log('[+] GPU timer: '+ns+'ns for clear');
        }else log('[*] Timer not ready yet');
        let disjoint=gl.getParameter(ext.GPU_DISJOINT_EXT);
        log('[+] Disjoint: '+disjoint);
      },100);
    }else log('[!] timer query not available');
  }catch(e){log('[!] timer: '+e.message.substring(0,80));}

  // === Texture format edge cases ===
  log('\n=== Texture format stress ===');
  let texFormats=[
    [gl.R8,gl.RED,gl.UNSIGNED_BYTE,'R8'],
    [gl.RG8,gl.RG,gl.UNSIGNED_BYTE,'RG8'],
    [gl.R16F,gl.RED,gl.HALF_FLOAT,'R16F'],
    [gl.R32F,gl.RED,gl.FLOAT,'R32F'],
    [gl.R8UI,gl.RED_INTEGER,gl.UNSIGNED_BYTE,'R8UI'],
    [gl.R32UI,gl.RED_INTEGER,gl.UNSIGNED_INT,'R32UI'],
    [gl.RGB9_E5,gl.RGB,gl.UNSIGNED_INT_5_9_9_9_REV,'RGB9_E5'],
    [gl.DEPTH_COMPONENT16,gl.DEPTH_COMPONENT,gl.UNSIGNED_SHORT,'D16'],
    [gl.DEPTH_COMPONENT32F,gl.DEPTH_COMPONENT,gl.FLOAT,'D32F'],
  ];
  for(let [ifmt,fmt,type,name] of texFormats){
    try{
      let t=gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D,t);
      gl.texImage2D(gl.TEXTURE_2D,0,ifmt,64,64,0,fmt,type,null);
      let err=gl.getError();
      log('[+] '+name+': '+(err===0?'OK':'err=0x'+err.toString(16)));
      gl.deleteTexture(t);
    }catch(e){log('[!] '+name+': '+e.message.substring(0,60));}
  }

  // === OOB readPixels attempt ===
  log('\n=== readPixels edge cases ===');
  try{
    gl.clearColor(0.5,0.25,0.75,1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    // Normal read
    let px=new Uint8Array(4);
    gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    log('[+] readPixels(0,0): ['+px[0]+','+px[1]+','+px[2]+','+px[3]+']');
    // Read at canvas boundary
    gl.readPixels(255,255,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    log('[+] readPixels(255,255): ['+px[0]+','+px[1]+','+px[2]+','+px[3]+']');
    // Read beyond canvas
    gl.readPixels(256,256,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    let err=gl.getError();
    log('[+] readPixels(256,256): ['+px[0]+','+px[1]+','+px[2]+','+px[3]+'] err='+(err===0?'none':'0x'+err.toString(16)));
    // Read with huge offset
    gl.readPixels(99999,99999,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    err=gl.getError();
    log('[+] readPixels(99999): ['+px[0]+','+px[1]+','+px[2]+','+px[3]+'] err='+(err===0?'none':'0x'+err.toString(16)));
  }catch(e){log('[!] readPixels: '+e.message.substring(0,80));}

  // === Large draw call ===
  log('\n=== Large draw calls ===');
  try{
    let vs='#version 300 es\nin vec4 p;void main(){gl_Position=p;}';
    let fs='#version 300 es\nprecision mediump float;out vec4 c;void main(){c=vec4(1);}';
    let vsh=gl.createShader(gl.VERTEX_SHADER);gl.shaderSource(vsh,vs);gl.compileShader(vsh);
    let fsh=gl.createShader(gl.FRAGMENT_SHADER);gl.shaderSource(fsh,fs);gl.compileShader(fsh);
    let prog=gl.createProgram();gl.attachShader(prog,vsh);gl.attachShader(prog,fsh);gl.linkProgram(prog);
    gl.useProgram(prog);
    // Large vertex buffer
    let bigBuf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,bigBuf);
    gl.bufferData(gl.ARRAY_BUFFER,4*1024*1024,gl.STATIC_DRAW); // 4MB
    let loc=gl.getAttribLocation(prog,'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc,4,gl.FLOAT,false,0,0);
    // Draw huge number of points
    gl.drawArrays(gl.POINTS,0,262144); // 256k points
    let err=gl.getError();
    log('[+] 256k points: '+(err===0?'OK':'err=0x'+err.toString(16)));
    // Try with invalid count
    gl.drawArrays(gl.POINTS,0,0x7FFFFFFF);
    err=gl.getError();
    log('[+] 2B points: err='+(err===0?'NONE(!!)':'0x'+err.toString(16)));
  }catch(e){log('[!] draw: '+e.message.substring(0,80));}

  // === Compute shader (WebGL2 doesn't have compute, but test extension) ===
  log('\n=== Misc ===');
  log('[*] WEBGL_lose_context test...');
  try{
    let lc=gl.getExtension('WEBGL_lose_context');
    if(lc){
      // Don't actually lose context — just check it's available
      log('[+] lose_context available (can force GPU reset)');
    }
  }catch(e){}

  // === Rapid context creation ===
  log('\n=== Context churn ===');
  try{
    let t0=Date.now();
    for(let i=0;i<100;i++){
      let tc=document.createElement('canvas');
      tc.width=tc.height=16;
      let tgl=tc.getContext('webgl2');
      if(tgl){
        tgl.clearColor(1,0,0,1);
        tgl.clear(tgl.COLOR_BUFFER_BIT);
        tgl.getExtension('WEBGL_lose_context').loseContext();
      }
    }
    log('[+] 100 context create/destroy: '+(Date.now()-t0)+'ms');
  }catch(e){log('[!] ctx churn: '+e.message.substring(0,80));}

  log('\n[*] v12 done.');
}
setTimeout(fuzz,500);
</script></body></html>
