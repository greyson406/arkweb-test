"use strict";
const LOG = document.getElementById('log');
const STATS = document.getElementById('stats');
let counts = {pass:0, exception:0, crash:0, total:0};
const T0 = Date.now();

function ts(){return ((Date.now()-T0)/1000).toFixed(1)+'s'}
function log(cat, name, result, cls){
  counts.total++;
  if(cls==='pass') counts.pass++;
  else if(cls==='crash') counts.crash++;
  else counts.exception++;
  const d = document.createElement('div');
  d.className = cls;
  d.textContent = `[${ts()}] [${cat}] ${name} → ${result}`;
  LOG.appendChild(d);
  if(counts.total % 20 === 0) LOG.scrollTop = LOG.scrollHeight;
  STATS.textContent = `Total:${counts.total} PASS:${counts.pass} EXCEPTION:${counts.exception} CRASH:${counts.crash}`;
}

function run(cat, name, fn){
  try{
    const t0 = Date.now();
    fn();
    const elapsed = Date.now() - t0;
    log(cat, name, elapsed > 5000 ? `PASS (SLOW ${elapsed}ms)` : 'PASS', 'pass');
  }catch(e){
    log(cat, name, 'EXCEPTION: '+e.message, 'exception');
  }
}

function runWithTimeout(cat, name, fn, ms){
  return new Promise(resolve=>{
    const timer = setTimeout(()=>{
      log(cat, name, `TIMEOUT (>${ms}ms)`, 'exception');
      resolve();
    }, ms);
    try{
      const result = fn();
      clearTimeout(timer);
      if(result instanceof Promise){
        result.then(()=>{clearTimeout(timer);log(cat,name,'PASS','pass');resolve()})
              .catch(e=>{clearTimeout(timer);log(cat,name,'EXCEPTION: '+e.message,'exception');resolve()});
      } else {
        log(cat, name, 'PASS', 'pass');
        resolve();
      }
    }catch(e){
      clearTimeout(timer);
      log(cat, name, 'EXCEPTION: '+e.message, 'exception');
      resolve();
    }
  });
}

async function runAsync(cat, name, fn){
  try{
    await fn();
    log(cat, name, 'PASS', 'pass');
  }catch(e){
    log(cat, name, 'EXCEPTION: '+e.message, 'exception');
  }
}

    if(i===50000){

function makeWasmModule(bytes){
  const buf = new Uint8Array(bytes);

}

// --- Valid WASM with edge-case functions ---
function fuzzWasmValid(){
  // Helper to build minimal WASM module with specific functions
  function buildWasm(funcs){
    // This creates a valid module with type section, function section, export section, code section
    const magic = [0x00,0x61,0x73,0x6d];
    const version = [0x01,0x00,0x00,0x00];

    // Type section: one func type () -> i32
    const typeSection = [0x01, 0x04, 0x01, 0x60, 0x00, 0x01, 0x7f];

    // Function section
    const funcSection = [0x03, 0x02, 0x01, 0x00]; // 1 function, type 0

    // Export section: export func 0 as "f"
    const exportSection = [0x07, 0x05, 0x01, 0x01, 0x66, 0x00, 0x00];

    // Code section: each func body
    const body = funcs;
    const bodyLen = body.length;
    const codeSection = [0x0a, bodyLen+3, 0x01, bodyLen+1, 0x00, ...body, 0x0b];

    return [...magic,...version,...typeSection,...funcSection,...exportSection,...codeSection];
  }

  const bodies = [
    // Just return 42
    [0x41, 0x2a],
    // Nested blocks
    [0x02,0x7f, 0x02,0x7f, 0x41,0x01, 0x0b, 0x0b],
    // Loop
    [0x41,0x00, 0x03,0x7f, 0x41,0x01, 0x6a, 0x0c,0x00, 0x0b],
    // br_table
    [0x41,0x00, 0x02,0x7f, 0x02,0x7f, 0x41,0x00, 0x0e,0x01,0x00,0x01, 0x0b, 0x41,0x01, 0x0b],
  ];

  for(const b of bodies){
    try{
      const mod = makeWasmModule(buildWasm(b));
      const inst = new WebAssembly.Instance(mod);
      inst.exports.f();
    }catch(e){}
  }
}

  g.shaderSource(fs,'precision mediump float;void main(){gl_FragColor=vec4(1,0,0,1);}');
  g.compileShader(fs);
  const prog = g.createProgram();
  g.attachShader(prog,vs);g.attachShader(prog,fs);g.linkProgram(prog);g.useProgram(prog);

  const buf = g.createBuffer();
  g.bindBuffer(g.ARRAY_BUFFER, buf);
  g.bufferData(g.ARRAY_BUFFER, new Float32Array([0,0,0,1,1,0]), g.STATIC_DRAW);
  const loc = g.getAttribLocation(prog,'p');
  g.enableVertexAttribArray(loc);
  g.vertexAttribPointer(loc,2,g.FLOAT,false,0,0);

  // Third pass: concurrent stress

  const concurrent = shuffled.slice(0,10).map(([cat,name,fn])=>{

  STATS.textContent = `DONE | Total:${counts.total} PASS:${counts.pass} EXCEPTION:${counts.exception} CRASH:${counts.crash} | Time:${ts()}`;
}

megaFuzz().catch(e=>log('SYS','FATAL',e.message,'crash'));
</script>
